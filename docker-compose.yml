services:
  app:
    build: .
    ports:
      - "5002:5001"
    env_file:
      - ./Server/.env
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
